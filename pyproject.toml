[project]
name = "modemmanager"
version = "0.1.0"
description = "Monitors USB modems, receives SMS and incoming calls, notifies Telegram"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
modemmanager = "modemmanager.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modemmanager*"]

[tool.setuptools.package-data]
modemmanager = ["web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
